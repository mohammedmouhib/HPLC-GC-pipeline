[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hplc-gc-pipeline"
version = "0.1.0"
description = "Config-driven HPLC + GC-MS data-processing pipeline for metabolic engineering experiments"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "mocca2",
    "rainbow-api",
    "pandas",
    "numpy",
    "matplotlib",
    "bokeh",
    "pyyaml",
]

[project.optional-dependencies]
# Web GUI (`hplc gui`). Not needed for the CLI pipeline; install with:
#   pip install -e ".[gui]"
gui = [
    "streamlit>=1.30",
    "ruamel.yaml>=0.17",  # round-trip YAML that preserves the template comments
]

[project.scripts]
hplc = "hplc_gc_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the commented config template + example CSVs inside the package so the
# GUI can seed a new experiment's three input files, regardless of install mode.
hplc_gc_pipeline = [
    "gui/config_template.yaml",
    "gui/compounds_default.csv",
    "gui/standard_default.csv",
    "gui/gc_compounds_default.csv",
]
